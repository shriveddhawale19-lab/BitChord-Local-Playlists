name: Build BitChord Benchmark APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reassemble source ZIP
        run: |
          cat BitChord-source.part0 BitChord-source.part1 BitChord-source.part2 > source.zip

      - name: Extract source
        run: unzip -q source.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "cmake;3.22.1"

      - name: Build optimized APK
        working-directory: BitChord-main
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDevBenchmark

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-Dev-Benchmark-APK
          path: BitChord-main/app/build/outputs/apk/dev/benchmark/*.apk
          if-no-files-found: error
