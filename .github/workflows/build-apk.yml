name: Build BitChord APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Reassemble source ZIP
        run: |
          cat BitChord-source.part0 BitChord-source.part1 BitChord-source.part2 > source.zip

      - name: Extract source
        run: unzip -q source.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
  
  

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "cmake;3.22.1"

      - name: Build APK
        working-directory: BitChord-main
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDevDebug

      - uses: actions/upload-artifact@v4
        with:
          name: BitChord-debug-APK
          path: BitChord-main/app/build/outputs/apk/dev/debug/*.apk
